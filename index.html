  --bg:#171717; --scene:#222; --panel:rgba(31,31,31,.92); --edge:rgba(255,255,255,.15);

  --tick:#cacaca;
}}

  --bg:#171717; --scene:#222; --panel:rgba(31,31,31,.92); --edge:rgba(255,255,255,.15);
  --ink:#f1f1f1; --ink-2:#b5b5b5; --ink-3:#8b8b8b; --hair:rgba(255,255,255,.13); --sel:rgba(255,255,255,.11);

html,body{height:100%;margin:0}

.seg{display:flex;gap:3px;background:var(--sel);border-radius:7px;padding:3px}
.seg button{border:0;background:transparent;color:var(--ink-2);font:inherit;font-size:11.5px;font-weight:500;
            padding:5px 11px;border-radius:5px;cursor:pointer}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.11)}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-2);cursor:pointer;user-select:none}
.chk input{margin:0;width:14px;height:14px;accent-color:var(--ink-2);cursor:pointer}

/* panels */
#panes{flex:1 1 auto;display:flex;min-height:0}
.pane{flex:1 1 0;min-width:0;position:relative;display:flex;flex-direction:column}
.pane + .pane{border-left:1px solid var(--hair)}
.pane h2{margin:0;padding:8px 14px 7px;font-size:12px;font-weight:600;color:var(--ink);
         border-bottom:1px solid var(--hair);display:flex;align-items:baseline;gap:8px}
.pane h2 em{font-style:normal;font-weight:400;font-size:11px;color:var(--ink-3)}
.pane .wrap{flex:1 1 auto;min-height:0;position:relative}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
canvas.grabbing{cursor:grabbing}

/* legend */
#legend{flex:0 0 auto;display:flex;align-items:center;gap:18px;flex-wrap:wrap;
        padding:9px 14px;border-top:1px solid var(--hair);font-size:11.5px;color:var(--ink-2)}
#legend .item{display:inline-flex;align-items:center;gap:7px;cursor:pointer;user-select:none;
              padding:2px 5px;margin:-2px -5px;border-radius:5px}
#legend .item:hover{background:var(--sel)}
#legend .item.off{opacity:.32}
#legend svg{display:block;overflow:visible}
#legend .note{margin-left:auto;color:var(--ink-3);font-size:10.5px}

#tip{position:fixed;pointer-events:none;opacity:0;transition:opacity .09s;z-index:9;
     background:var(--panel);border:1px solid var(--edge);border-radius:9px;box-shadow:var(--shadow);
     padding:7px 10px;font-size:11.5px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#tip.on{opacity:1}
#tip .t{font-weight:600;display:flex;align-items:center;gap:6px;margin-bottom:3px}
#tip dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:0 12px}
#tip dt{color:var(--ink-3)}
#tip dd{margin:0;text-align:right}

button:focus-visible,.chk:focus-visible,.item:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
@media (max-width:820px){
  #panes{flex-direction:column}
  .pane + .pane{border-left:0;border-top:1px solid var(--hair)}
  #bar h1{width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

    const pos=[],col=[],c1=new THREE.Color(c1h),c2=new THREE.Color(c2h),N=80;
    for(let i=0;i<=N;i++){const t=i/N,c=c1.clone().lerp(c2,t);
      pos.push(p1.x+(p2.x-p1.x)*t,p1.y+(p2.y-p1.y)*t,p1.z+(p2.z-p1.z)*t);col.push(c.r,c.g,c.b);}
    const g=new THREE.BufferGeometry();
    g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
    g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
    const l=new THREE.Line(g,new THREE.LineBasicMaterial({vertexColors:true,transparent:true,opacity:op||.95}));
    scene.add(l); return l;
  }
  grad(V3(0,0,0),      V3(100,0,0),   0x0d0d0d,0xf4f4f4);   // L*  black -> white
  grad(V3(LC,-SR,0),   V3(LC,SR,0),   0x1f9b3a,0xd22d2d);   // a*  green -> red
  grad(V3(LC,0,-SR),   V3(LC,0,SR),   0x1b4fd4,0xe3ba00);   // b*  blue  -> yellow

  function cone(pos,dir,colour){
    const m=new THREE.Mesh(new THREE.ConeGeometry(1.9,5.4,18),new THREE.MeshPhongMaterial({color:colour,shininess:30}));
    m.position.copy(pos); m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir.clone().normalize());
    scene.add(m);
  }
  cone(V3(100,0,0),new THREE.Vector3(0,1,0),0xf4f4f4);
  cone(V3(LC,SR,0),new THREE.Vector3(1,0,0),0xd22d2d);
  cone(V3(LC,0,SR),new THREE.Vector3(0,0,1),0xe3ba00);

  /* ticks along each axis */
  function tick(p,dir,len,colour,op){
    const g=new THREE.BufferGeometry().setFromPoints([p.clone().sub(dir.clone().multiplyScalar(len)),
                                                      p.clone().add(dir.clone().multiplyScalar(len))]);
    scene.add(new THREE.Line(g,new THREE.LineBasicMaterial({color:colour,transparent:true,opacity:op||.5})));
  }
  const minorLabels=[];
  function lab(text,pos,h,minor){
    const sp=sprite(text,css('--tick'),40,minor?500:600); setH(sp,h||4.2); sp.position.copy(pos);
    scene.add(sp); themed.push(sp);
    if(minor){ sp.visible=false; minorLabels.push(sp); }
    return sp;
  }
  // major divisions every 20 units, labelled at all times
  [20,40,60,80].forEach(v=>{ tick(V3(v,0,0),new THREE.Vector3(1,0,0),1.7,0x9a9a9a); lab(String(v),V3(v,-5.2,0)); });
  lab('L* 100',V3(105,0,0),5);
  [-40,-20,20,40].forEach(v=>{ tick(V3(LC,v,0),new THREE.Vector3(0,1,0),1.7,0x9a9a9a); lab(String(v),V3(LC-5.4,v,0)); });
  lab('+a*',V3(LC,SR+8,0),5); lab('−a*',V3(LC,-SR-8,0),5);
  [-40,-20,20,40].forEach(v=>{ tick(V3(LC,0,v),new THREE.Vector3(0,1,0),1.7,0x9a9a9a); lab(String(v),V3(LC-5.4,0,v)); });
  lab('+b*',V3(LC,0,SR+8),5); lab('−b*',V3(LC,0,-SR-8),5);

  // 5-unit subdivisions across the band the specimens actually occupy;
  // their numbers stay hidden until the view is zoomed in, so the wide shot stays legible
  const BAND={L:[55,85], a:[-4,14], b:[15,60]};
  function minors(from,to,step,labelEvery,skip,onAxis,markDir,labPos){
    for(let v=Math.ceil(from/step)*step; v<=to+1e-9; v+=step){
      if(Math.abs(v%skip)<1e-9) continue;
      tick(onAxis(v),markDir,1.0,0xa8a8a8,.34);
      if(Math.abs(v%labelEvery)<1e-9) lab(String(v),labPos(v),2.9,true);
    }
  }
  minors(BAND.L[0],BAND.L[1],5,10,20,v=>V3(v,0,0),  new THREE.Vector3(1,0,0), v=>V3(v,-3.6,0));
  minors(BAND.a[0],BAND.a[1],2, 4,20,v=>V3(LC,v,0), new THREE.Vector3(0,1,0), v=>V3(LC-3.7,v,0));
  minors(BAND.b[0],BAND.b[1],5,10,20,v=>V3(LC,0,v), new THREE.Vector3(0,1,0), v=>V3(LC-3.7,0,v));

  /* specimens for this thickness */
  const pts=new THREE.Group(); scene.add(pts);
  const meshes=[], byKey={};
  D.pts.filter(p=>p.t===thickness).forEach(p=>{
    const s=KM[p.k];
    const m=new THREE.Mesh(GEO[s.shape],new THREE.MeshPhongMaterial({
      color:s.col,shininess:44,specular:0x3a3a3a}));
    m.position.copy(V3(p.L,p.a,p.b));
    if(s.shape==='triangle') m.rotation.set(-0.62,0.42,0);
    m.userData=p; pts.add(m); meshes.push(m);
    (byKey[p.k]=byKey[p.k]||[]).push(p);
  });

  /* stems down to the a*b* plane, over a grid you can count squares on */
  const drops=new THREE.Group(); scene.add(drops);
  const dropByKey={};
  Object.keys(byKey).forEach(k=>{
    const v=[];
    byKey[k].forEach(p=>{ v.push(V3(p.L,p.a,p.b), V3(LC,p.a,p.b)); });
    const g=new THREE.BufferGeometry().setFromPoints(v);
    const l=new THREE.LineSegments(g,new THREE.LineBasicMaterial({
      color:KM[k].col,transparent:true,opacity:.45}));
    drops.add(l); dropByKey[k]=l;
  });

  const grid=new THREE.Group(); scene.add(grid);
  {
    const A0=-4,A1=14,B0=15,B1=60,SA=2,SB=5, seg=[], bold=[];
    for(let a=A0;a<=A1+1e-9;a+=SA){ (Math.abs(a%10)<1e-9?bold:seg).push(V3(LC,a,B0),V3(LC,a,B1)); }
    for(let b=B0;b<=B1+1e-9;b+=SB){ (Math.abs(b%20)<1e-9?bold:seg).push(V3(LC,A0,b),V3(LC,A1,b)); }
    const mk=(pts,op,w)=>{
      const g=new THREE.BufferGeometry().setFromPoints(pts);
      grid.add(new THREE.LineSegments(g,new THREE.LineBasicMaterial({color:0x8e8e8e,transparent:true,opacity:op})));
    };
    mk(seg,.20); mk(bold,.42);
    const ta=sprite('a*',css('--tick'),42,700); setH(ta,3.4);
    ta.position.copy(V3(LC,(A0+A1)/2,B0-4.2)); grid.add(ta); themed.push(ta);
    const tb=sprite('b*',css('--tick'),42,700); setH(tb,3.4);
    tb.position.copy(V3(LC,A0-4.0,(B0+B1)/2)); grid.add(tb); themed.push(tb);
  }

  return {renderer,scene,cam,canvas,meshes,themed,pts,minorLabels,drops,dropByKey,grid};
}

const A=makePanel(document.getElementById('cA'),'0.5');
const B=makePanel(document.getElementById('cB'),'1.0');
const PANES=[A,B];

/* ---------- camera ---------- */
const VIEWS={whole:{r:215,target:new THREE.Vector3(0,0,0)},
             data :{r:78, target:MID.clone()}};
let zoom='whole';
const camS={theta:-0.70,phi:1.10,r:VIEWS.whole.r};
const target=VIEWS.whole.target.clone();
const camB={theta:camS.theta,phi:camS.phi,r:camS.r};
const targetB=target.clone();
let linked=true;

function place(pane,s,t){
  const {theta,phi,r}=s;
  pane.cam.position.set(t.x+r*Math.sin(phi)*Math.sin(theta),
                        t.y+r*Math.cos(phi),
                        t.z+r*Math.sin(phi)*Math.cos(theta));
  pane.cam.up.set(0,1,0); pane.cam.lookAt(t);
}
function applyCams(){ place(A,camS,target); place(B, linked?camS:camB, linked?target:targetB); }

function resize(){
  PANES.forEach(p=>{
    const w=p.canvas.clientWidth||1, h=p.canvas.clientHeight||1;
    p.renderer.setSize(w,h,false);
    p.cam.aspect=w/h; p.cam.updateProjectionMatrix();
  });
  applyCams();
}
addEventListener('resize',resize);

function setZoom(z){
  zoom=z;
  camS.r=VIEWS[z].r; camB.r=VIEWS[z].r;
  target.copy(VIEWS[z].target); targetB.copy(VIEWS[z].target);
  applyCams();
}

/* drag / wheel / pinch, per panel */
PANES.forEach((pane,idx)=>{
  const cv=pane.canvas;
  const S=()=> (idx===0||linked)?camS:camB;
  const T=()=> (idx===0||linked)?target:targetB;
  let drag=false,pan=false,last={x:0,y:0},pinch=null;

  cv.addEventListener('pointerdown',e=>{
    drag=true; pan=e.shiftKey||e.button===2; last={x:e.clientX,y:e.clientY};
    cv.setPointerCapture(e.pointerId); cv.classList.add('grabbing');
  });
  cv.addEventListener('pointerup',()=>{drag=false;cv.classList.remove('grabbing');});
  cv.addEventListener('contextmenu',e=>e.preventDefault());
  cv.addEventListener('pointermove',e=>{
    if(!drag){ hover(e,pane); return; }
    const dx=e.clientX-last.x,dy=e.clientY-last.y; last={x:e.clientX,y:e.clientY};
    const s=S(),t=T();
    if(pan){
      const f=s.r*0.0021;
      const right=new THREE.Vector3().setFromMatrixColumn(pane.cam.matrix,0);
      const up=new THREE.Vector3().setFromMatrixColumn(pane.cam.matrix,1);
      t.addScaledVector(right,-dx*f).addScaledVector(up,dy*f);
    }else{
      s.theta-=dx*0.0072;
      s.phi=Math.max(0.05,Math.min(Math.PI-0.05,s.phi+dy*0.0072));
    }
    applyCams();
  });
  cv.addEventListener('pointerleave',()=>tip.classList.remove('on'));
  cv.addEventListener('wheel',e=>{
    e.preventDefault(); const s=S();
    s.r=Math.max(16,Math.min(700,s.r*Math.exp(e.deltaY*0.0013))); applyCams();
  },{passive:false});
  cv.addEventListener('touchstart',e=>{if(e.touches.length===2)pinch=d2(e);},{passive:true});
  cv.addEventListener('touchmove',e=>{
    if(e.touches.length===2&&pinch){
      const d=d2(e),s=S(); s.r=Math.max(16,Math.min(700,s.r*(pinch/d)));
      pinch=d; applyCams(); e.preventDefault();
    }
  },{passive:false});
  cv.addEventListener('touchend',()=>pinch=null,{passive:true});
});
function d2(e){const a=e.touches[0],b=e.touches[1];return Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);}

/* ---------- hover ---------- */
const tip=document.getElementById('tip'), ray=new THREE.Raycaster(), ndc=new THREE.Vector2();
function hover(e,pane){
  const r=pane.canvas.getBoundingClientRect();
  ndc.x=((e.clientX-r.left)/r.width)*2-1; ndc.y=-((e.clientY-r.top)/r.height)*2+1;
  ray.setFromCamera(ndc,pane.cam);
  const hit=ray.intersectObjects(pane.meshes.filter(m=>m.visible),false)[0];
  if(!hit){ tip.classList.remove('on'); return; }
  const p=hit.object.userData, s=KM[p.k];
  tip.innerHTML=`<div class="t">${swatch(s,11)}${s.label}</div>`+
    `<dl><dt>Specimen</dt><dd>${p.i}</dd><dt>L*</dt><dd>${p.L.toFixed(1)}</dd>`+
    `<dt>a*</dt><dd>${p.a.toFixed(1)}</dd><dt>b*</dt><dd>${p.b.toFixed(1)}</dd></dl>`;
  let x=e.clientX+14,y=e.clientY+14;
  if(x+190>innerWidth) x=e.clientX-190;
  if(y+110>innerHeight) y=e.clientY-115;
  tip.style.left=x+'px'; tip.style.top=y+'px'; tip.classList.add('on');
}

/* ---------- legend ---------- */
function swatch(s,size){
  const c='#'+s.col.toString(16).padStart(6,'0'), n=size||13, h=n, w=n;
  const stroke='rgba(0,0,0,.42)';
  let shape;
  if(s.shape==='circle')   shape=`<circle cx="${w/2}" cy="${h/2}" r="${n*0.42}" fill="${c}" stroke="${stroke}"/>`;
  else if(s.shape==='square') shape=`<rect x="${n*0.13}" y="${n*0.13}" width="${n*0.74}" height="${n*0.74}" fill="${c}" stroke="${stroke}"/>`;
  else shape=`<polygon points="${w/2},${n*0.1} ${n*0.9},${n*0.86} ${n*0.1},${n*0.86}" fill="${c}" stroke="${stroke}"/>`;
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true">${shape}</svg>`;
}
const legend=document.getElementById('legend');
KEYS.forEach(s=>{
  const el=document.createElement('span');
  el.className='item'; el.tabIndex=0; el.dataset.k=s.k;
  el.innerHTML=swatch(s)+'<span>'+s.label+'</span>';
  const t=()=>{ shown[s.k]=!shown[s.k]; el.classList.toggle('off',!shown[s.k]); applyShown(); };
  el.addEventListener('click',t);
  el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();t();}});
  legend.appendChild(el);
});
const note=document.createElement('span');
note.className='note';
note.textContent='Squares high amount, circles low · one shared scale on all three axes · grid squares are 2 of a* by 5 of b*';
legend.appendChild(note);

function applyShown(){
  PANES.forEach(p=>{
    p.meshes.forEach(m=>m.visible=shown[m.userData.k]);
    Object.keys(p.dropByKey).forEach(k=>p.dropByKey[k].visible=shown[k]);
  });
}

/* ---------- controls ---------- */
function segment(id,attr,fn){
  const el=document.getElementById(id);
  el.addEventListener('click',e=>{
    const b=e.target.closest('button'); if(!b) return;
    [...el.querySelectorAll('button')].forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
    fn(b.getAttribute(attr));
  });
}
segment('zoomSeg','data-z',setZoom);
let spin=!matchMedia('(prefers-reduced-motion:reduce)').matches;
document.getElementById('spin').checked=spin;
document.getElementById('spin').addEventListener('change',e=>spin=e.target.checked);
function setGrid(on){ PANES.forEach(p=>{p.drops.visible=on; p.grid.visible=on;}); }
document.getElementById('stems').addEventListener('change',e=>setGrid(e.target.checked));
document.getElementById('sync').addEventListener('change',e=>{
  linked=e.target.checked;
  if(linked){ camB.theta=camS.theta;camB.phi=camS.phi;camB.r=camS.r; targetB.copy(target); }
  applyCams();
});

/* ---------- theme ---------- */
function paint(){
  const bg=hex('--scene'); PANES.forEach(p=>p.scene.background=bg);
  PANES.forEach(p=>p.themed.forEach(sp=>{
    const old=sp.material.map, ns=sprite(sp.userData.txt,css('--tick'),40,600);
    sp.material.map=ns.material.map; sp.material.needsUpdate=true; if(old) old.dispose();
  }));
}
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',()=>setTimeout(paint,30));
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(paint);

/* ---------- level of detail: the 5-unit numbers only when they can be read ---------- */
let lastLod=null;
function updateLod(){
  const near = Math.min(camS.r, linked?camS.r:camB.r) < 130;
  if(near===lastLod) return; lastLod=near;
  PANES.forEach(p=>p.minorLabels.forEach(sp=>sp.visible=near));
}

/* ---------- loop ---------- */
resize(); paint(); applyShown(); applyCams(); updateLod();
setGrid(document.getElementById('stems').checked);
let t0=performance.now();
(function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min((now-t0)/1000,0.05); t0=now;
  if(spin){ camS.theta+=dt*0.16; if(!linked) camB.theta+=dt*0.16; applyCams(); }
  updateLod();
  PANES.forEach(p=>p.renderer.render(p.scene,p.cam));
})(performance.now());
</script>
</body>
</html>
